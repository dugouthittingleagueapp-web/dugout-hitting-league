name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Regenerate Lockfile for Verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Dependencies
        run: npm ci

      - name: Preserve Regenerated Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: corrected-package-lock
          path: package-lock.json

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Automated Umpire Scoring & Logic Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build
