name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Regenerate Lockfile for Verification
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Dependencies
        run: npm ci

      - name: Preserve Regenerated Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: corrected-package-lock
          path: package-lock.json

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Automated Umpire Scoring & Logic Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      # One-time branch-only repair: update the stale lockfile after all checks pass.
      # Workflow pushes using GITHUB_TOKEN do not initiate new CI runs.
      - name: Save Corrected Lockfile to Pull Request Branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync package-lock.json with package.json"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          fi
